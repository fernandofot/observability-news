<?xml version="1.0" encoding="UTF-8"?>
<svg width="680" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" height="380"><style>
    :root { --color-text-primary: #E5E7EB;
    --color-text-secondary: #9CA3AF;
    --color-text-tertiary: #6B7280;
    --color-text-info: #60A5FA;
    --color-text-success: #34D399;
    --color-text-warning: #FBBF24;
    --color-text-danger: #F87171;
    --color-background-primary: rgb(33,33,33);
    --color-background-secondary: rgb(48,48,48);
    --color-background-tertiary: rgb(26,25,25);
    --color-border-tertiary: rgba(255,255,255,0.15);
