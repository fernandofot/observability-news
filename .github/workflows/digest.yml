name: Send digest

on:
  schedule:
    - cron: "47 2 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync with remote
        run: git pull --rebase origin main

      - name: Fetch subscribers from the sheet
        id: subscribers
        env:
          SUBSCRIBERS_URL: ${{ secrets.SUBSCRIBERS_URL }}
          SUBSCRIBERS_TOKEN: ${{ secrets.SUBSCRIBERS_TOKEN }}
        run: |
          set -euo pipefail
          payload="$(curl -L -fsS --retry 3 --retry-delay 5 \
            -G --data-urlencode "token=${SUBSCRIBERS_TOKEN}" \
            "${SUBSCRIBERS_URL}")"
          emails="$(printf '%s' "${payload}" | jq -r '.subscribers[]? | select(length > 0)')"
          if [ -z "${emails}" ]; then
            echo "The sheet endpoint returned no subscribers."
            exit 1
          fi
          json="$(printf '%s\n' "${emails}" | jq -Rsc 'split("\n") | map(select(length > 0))')"
          echo "list=${json}" >> "${GITHUB_OUTPUT}"

      - name: Send digest
        env:
          DIGEST_SUBSCRIBERS: ${{ steps.subscribers.outputs.list }}
          DIGEST_TRANSPORT: smtp
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 scripts/send_digest.py

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Mark digest items as sent"
            git pull --rebase origin main
            git push
          fi