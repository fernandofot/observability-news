name: Send digest

on:
  schedule:
    - cron: "47 2 * * *"
    - cron: "47 12 * * *"
  workflow_dispatch:

concurrency:
  group: collect-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync with remote
        run: git pull --rebase origin main

      - name: Send digest
        env:
          DIGEST_SUBSCRIBERS: ${{ secrets.DIGEST_SUBSCRIBERS }}
          DIGEST_TRANSPORT: smtp
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python3 scripts/send_digest.py

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-registry.json
          if git diff --cached --quiet; then
            echo "No registry changes to commit."
          else
            git commit -m "Mark digest items as sent"
            git pull --rebase origin main
            git push
          fi