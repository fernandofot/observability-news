name: Collect observability news

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 10 * * *" 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Collect feeds
        run: python3 scripts/collect.py

      - name: Build news pages
        run: python3 scripts/build_site.py

      - name: Commit updated registry and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-registry.json news.html index.html
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update news registry and pages (automated collection)"
          git push