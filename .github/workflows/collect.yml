name: Collect observability news

on:
  schedule:
    # Two attempts, ten hours apart, off the top of the hour where the
    # scheduler is busiest. GitHub delays scheduled runs by several hours,
    # so these times are best effort and the site copy says so.
    - cron: "17 2 * * *"
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialise runs so two overlapping jobs never push at the same time.
concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Collect feeds
        run: python3 scripts/collect.py

      - name: Build news pages
        run: python3 scripts/build_site.py

      - name: Commit updated registry and pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-registry.json news.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update news registry and pages (automated collection)"
          git pull --rebase origin main
          git push